<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>ระบบติดตามสถานะ Modify Jig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F8FAFC; --card: #FFFFFF; --ink: #0F172A; --ink-soft: #64748B; --line: #E2E8F0;
      --accent: #4F46E5; --accent-paint: #E11D48; --accent-maint: #D97706;
      --green: #10B981; --red: #EF4444; --amber: #F59E0B;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --radius: 12px; --radius-sm: 8px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .app-root { max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #94A3B8; margin: 0 0 6px; }

    .home-wrap { padding: 40px 20px 20px; max-width: 600px; margin: 0 auto; }
    .home-head { text-align: center; margin-bottom: 32px; }
    .home-head h1 { font-family: 'Oswald', sans-serif; font-size: 28px; margin: 0; color: var(--ink); }
    .role-card { display: block; background: var(--card); border-left: 8px solid var(--card-accent, var(--accent)); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; text-decoration: none; color: var(--ink); box-shadow: var(--shadow-sm); }
    .role-card.role-overview { --card-accent: var(--accent); } .role-card.role-paint { --card-accent: var(--accent-paint); } .role-card.role-maintenance { --card-accent: var(--accent-maint); }
    .role-tag { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: var(--card-accent); padding: 4px 10px; border-radius: 20px; margin-bottom: 10px; }
    .role-card h2 { font-family: 'Oswald', sans-serif; font-size: 20px; margin: 0 0 6px; }
    .role-card p { margin: 0; font-size: 14px; color: var(--ink-soft); }

    .role-header { color: #FFF; padding: 24px 20px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: var(--shadow-md); margin-bottom: 20px; }
    .bg-overview { background: linear-gradient(135deg, #1E293B, #0F172A); } .bg-paint { background: linear-gradient(135deg, #BE123C, #881337); } .bg-maintenance { background: linear-gradient(135deg, #B45309, #78350F); }
    .role-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .home-link, .refresh-pill { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .role-header h1 { font-family: 'Oswald', sans-serif; font-size: 24px; margin: 0; letter-spacing: 0.5px; }

    .content { padding: 0 16px; max-width: 800px; margin: 0 auto; }
    .tabs { display: flex; background: var(--line); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; border-radius: 6px; font-weight: 600; font-size: 13px; color: var(--ink-soft); cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow-sm); }

    .form-card, .model-card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); border: 1px solid var(--line); }

    .overall-card { background: var(--ink); color: #fff; border: none; border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .overall-title { font-family: 'Oswald', sans-serif; color: #94A3B8; font-size: 14px; text-transform: uppercase; margin-bottom: 12px; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .metric { text-align: center; background: var(--bg); border-radius: var(--radius-sm); padding: 10px 4px; border: 1px solid var(--line); }
    .overall-card .metric { background: rgba(255,255,255,0.1); border: none; }
    .overall-card .metric .l { color: #CBD5E1; }
    .metric .v { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; display: block; margin-bottom: 2px; }
    .metric .l { font-size: 10px; color: var(--ink-soft); }

    /* Stock-based success % chip (overall + per model) */
    .stockpct-box { text-align: right; }
    .stockpct-box .lbl { font-size: 10px; color: #CBD5E1; text-transform: uppercase; }
    .stockpct-box .val { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; color: #60A5FA; }
    .model-card .stockpct-box .lbl { color: var(--ink-soft); }
    .model-card .stockpct-box .val { color: var(--accent); font-size: 20px; }

    /* ===== Desktop "one screen, no scroll" mode (Overview) ===== */
    @media (min-width: 901px) {
      body.desktop-fit { overflow: hidden; height: 100vh; }
      #overviewContentOuter { overflow: hidden; }
      #overviewContent { transform-origin: top center; max-width: 1400px; width: 96%; }
      #overviewContent .models-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
      #overviewContent .model-card { margin-bottom: 0; }
    }

    .dash-stock { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
    .progress-bg { height: 10px; background: var(--line); border-radius: 5px; margin-top: 8px; overflow: hidden; width: 100%; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 5px; transition: width 1s cubic-bezier(.22,1,.36,1); }

    /* Progressive circular % success ring */
    .ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ring-fill { transition: stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1); }
    .ring-label { position: absolute; text-align: center; font-family: 'IBM Plex Mono', monospace; font-weight: 700; line-height: 1.1; }
    .ring-label .n { display: block; }
    .ring-label .u { display: block; font-size: 9px; font-weight: 600; opacity: .7; letter-spacing: .05em; }
    .overall-ring-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
    .overall-ring-row .ring-meta { flex: 1; }
    .overall-ring-row .ring-meta .t { font-size: 13px; color: #CBD5E1; margin-bottom: 4px; }
    .overall-ring-row .ring-meta .d { font-size: 12px; color: #94A3B8; }

    .chip-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .chip { padding: 8px 16px; border: 1px solid var(--line); background: var(--bg); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
    .chip-active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
    .field input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 15px; margin-bottom: 16px; font-family: 'IBM Plex Mono', monospace;}
    .save-btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 15px; cursor: pointer; }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ng-btn { background: var(--red); }
    .cancel-btn { background: transparent; border: 1px solid var(--red); color: var(--red); font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; cursor: pointer; }
    .cancel-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .cons-card { border-left: 6px solid var(--accent); background: #fff; border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow-sm); border: 1px solid var(--line); }
    .cons-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cons-title { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; }
    .cons-sub { color: var(--ink-soft); font-size: 14px; font-weight: 500; }
    .cons-stat-row { display: flex; justify-content: space-between; background: var(--bg); padding: 10px; border-radius: 6px; margin-bottom: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
    .cons-stat-row span { font-weight: 600; }
    .highlight-red { color: var(--red); font-size: 16px;}
    .highlight-green { color: var(--green); font-size: 16px;}

    .aging-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; margin-left: 6px; }
    .aging-ok { background: #E2E8F0; color: var(--ink-soft); }
    .aging-warn { background: #FEF3C7; color: #92400E; }
    .aging-critical { background: #FEE2E2; color: #991B1B; }

    /* List History */
    .ticket-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; gap: 10px; }
    .tr-main { flex: 1; min-width: 0; }
    .tr-model { font-weight: 700; font-size: 14px; }
    .tr-note { font-size: 12px; color: var(--ink-soft); margin-top: 2px; overflow-wrap: anywhere; }
    .tr-qty { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-weight: 600; white-space: nowrap; }
    .tr-time { font-size: 11px; color: var(--ink-soft); }
    .tr-by { font-size: 11px; color: var(--ink-soft); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 50; max-width: 90vw; text-align: center; }
    .toast.error { background: var(--red); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .sync-indicator { font-size: 10px; color: rgba(255,255,255,0.5); text-align: center; margin-top: 10px; font-family: 'IBM Plex Mono', monospace;}
    .sync-indicator.pending { color: #FCD34D; }
    .sync-indicator.error { color: #FCA5A5; }

    /* Username gate */
    .gate-wrap { max-width: 420px; margin: 0 auto; padding: 60px 20px; text-align: center; }
    .gate-wrap h1 { font-family: 'Oswald', sans-serif; font-size: 22px; }
    .gate-wrap input { width: 100%; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 16px; margin: 16px 0; text-align: center; }
    .user-pill { position: fixed; top: 8px; right: 8px; background: rgba(0,0,0,0.55); color: #fff; font-size: 11px; padding: 5px 10px; border-radius: 14px; z-index: 40; cursor: pointer; }

    /* ===== PLAN (แผนการผลิต) ===== */
    .bg-plan { background: linear-gradient(135deg, #0F766E, #134E4A); }
    .role-card.role-plan { --card-accent: #0F766E; }
    .m-718W { --mc:#3B6FD4; } .m-578W { --mc:#6AA43A; } .m-D46H { --mc:#7B2FBE; }
    .mbadge { display:inline-block; min-width:52px; white-space:nowrap; text-align:center; padding:3px 8px; border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:#fff; background:var(--mc,#64748B); }
    .plan-bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .plan-bar input[type=date], .plan-bar select { padding:9px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:14px; font-family:'IBM Plex Mono',monospace; background:#fff; }
    .sum-strip { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:14px; }
    .sum-cell { background:#fff; border:1px solid var(--line); border-top:4px solid var(--sc,#94A3B8); border-radius:8px; padding:6px 4px; text-align:center; }
    .sum-cell .v { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; display:block; }
    .sum-cell .l { font-size:10px; color:var(--ink-soft); }
    .plan-row { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:6px; flex-wrap:wrap; }
    .plan-row .no { font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:22px; text-align:right; }
    .plan-row .color { font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; min-width:70px; }
    .plan-row .grow { flex:1; min-width:10px; }
    .plan-row select { padding:8px; border:1px solid var(--line); border-radius:6px; font-size:14px; background:#fff; }
    .plan-row .go { padding:8px 14px; background:#0F766E; color:#fff; border:none; border-radius:6px; font-weight:700; font-size:13px; cursor:pointer; }
    .spill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:700; color:#fff; background:var(--sc,#94A3B8); white-space:nowrap; }
    .spill small { font-weight:500; opacity:.85; margin-left:4px; }
    .mx-wrap { overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius); }
    table.mx { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; font-size:12px; }
    table.mx th, table.mx td { border-bottom:1px solid var(--line); border-right:1px solid var(--line); padding:6px; vertical-align:top; }
    table.mx thead th { background:#134E4A; color:#fff; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; position:sticky; top:0; min-width:92px; }
    table.mx thead th small { display:block; font-weight:500; opacity:.7; font-size:10px; }
    table.mx th.st { position:sticky; left:0; z-index:2; text-align:left; min-width:104px; background:#fff; border-left:6px solid var(--sc); font-family:'Inter',sans-serif; font-size:13px; font-weight:700; }
    table.mx thead th.st { background:#134E4A; z-index:3; border-left:6px solid #134E4A; }
    table.mx td { min-width:92px; }
    .mx-chip { display:block; margin:0 0 4px; padding:3px 6px; border-radius:5px; background:var(--mc,#64748B); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; white-space:nowrap; }
    .mx-chip.edit { cursor:pointer; }
    .mx-chip i { font-style:normal; opacity:.75; margin-right:4px; }
    .month-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .month-nav button { background:#fff; border:1px solid var(--line); border-radius:20px; padding:6px 14px; font-weight:700; cursor:pointer; }
    .month-nav .mt { font-family:'Oswald',sans-serif; font-size:20px; }

    /* ===== TV / PC 16:9 Overview (stage 1920x1080 ปรับสเกลให้พอดีจอ) ===== */
    body.tv-mode { margin:0; overflow:hidden; height:100vh; background:#0B1220; }
    .tv-stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; padding:20px 28px; color:#F1F5F9; background:#0B1220; display:flex; flex-direction:column; gap:14px; font-family:'Inter',system-ui,sans-serif; }
    .tv-stage .m-718W { --mc:#6B9BFF; } .tv-stage .m-578W { --mc:#8BCB55; } .tv-stage .m-D46H { --mc:#B66CF5; }
    .tv-head { display:flex; align-items:center; gap:24px; height:52px; padding-right:300px; }
    .tv-head h1 { font-family:'Oswald',sans-serif; font-size:34px; margin:0; letter-spacing:.5px; flex:1; }
    .tv-head button { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:20px; padding:8px 18px; font-size:15px; font-weight:600; cursor:pointer; }
    .tv-head .clock { font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:700; }
    .tv-head .sync-indicator { margin:0; font-size:13px; }
    .tv-kpis { display:grid; grid-template-columns:repeat(7,1fr); gap:12px; height:96px; }
    .tv-kpi { background:#131F38; border:1px solid #24324F; border-radius:12px; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; overflow:hidden; }
    .tv-kpi .l { font-size:14px; color:#94A3B8; line-height:1.25; }
    .tv-kpi .v { font-family:'IBM Plex Mono',monospace; font-size:38px; font-weight:700; line-height:1; }
    .tv-sec { font-family:'Oswald',sans-serif; font-size:20px; color:#94A3B8; letter-spacing:.5px; margin:0 0 8px; }
    .tv-plan { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .tv-col { background:#131F38; border:1px solid #24324F; border-radius:12px; padding:14px 16px; }
    .tv-col-head { display:flex; align-items:center; justify-content:space-between; }
    .tv-col-head .t { font-family:'Oswald',sans-serif; font-size:32px; font-weight:700; color:var(--mc); }
    .tv-col-head .sop { text-align:right; font-size:13px; color:#94A3B8; }
    .tv-col-head .sop b { display:block; font-family:'IBM Plex Mono',monospace; font-size:22px; color:#F1F5F9; }
    .tv-bar { display:flex; height:8px; border-radius:4px; overflow:hidden; background:#24324F; margin:10px 0; }
    .tv-chips { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; margin-bottom:8px; }
    .tv-chip { text-align:center; border-top:3px solid var(--sc); background:#0F1A31; border-radius:5px; padding:3px 0; }
    .tv-chip b { display:block; font-family:'IBM Plex Mono',monospace; font-size:18px; line-height:1.2; }
    .tv-chip span { font-size:10px; color:#94A3B8; white-space:nowrap; }
    .tv-chip.zero b { color:#3B4A6B; }
    .tv-item { display:flex; align-items:center; gap:10px; height:27px; border-bottom:1px solid #1B2944; }
    .tv-item .no { width:26px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:14px; color:#64748B; }
    .tv-item .color { width:96px; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:18px; }
    .tv-item .dots { display:flex; gap:2px; }
    .tv-item .dots i { width:12px; height:8px; border-radius:2px; background:rgba(255,255,255,.12); }
    .tv-item .pill { margin-left:auto; min-width:92px; text-align:center; padding:2px 10px; border-radius:11px; font-size:14px; font-weight:700; color:#fff; background:var(--sc); }
    .tv-item .dt { width:54px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:16px; color:#CBD5E1; }
    .tv-item .dt.none { color:#3B4A6B; }
    .tv-jig { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
    .tv-jcard { background:#131F38; border:1px solid #24324F; border-radius:12px; padding:10px 14px; }
    .tv-jcard .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .tv-jcard .name { font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; color:#A5B4FC; }
    .tv-jcard .stock { text-align:right; font-size:11px; color:#94A3B8; }
    .tv-jcard .stock b { display:block; font-family:'IBM Plex Mono',monospace; font-size:24px; color:#F1F5F9; line-height:1; }
    .tv-side { border-top:1px solid #24324F; padding:6px 0 4px; }
    .tv-side .sl { font-size:13px; font-weight:700; color:#CBD5E1; margin-bottom:3px; display:flex; align-items:center; gap:6px; }
    .tv-side .nums { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; text-align:center; }
    .tv-side .nums b { display:block; font-family:'IBM Plex Mono',monospace; font-size:22px; line-height:1.1; }
    .tv-side .nums span { font-size:10px; color:#94A3B8; }
    .tv-side .pb { height:5px; background:#24324F; border-radius:3px; margin-top:5px; overflow:hidden; }
    .tv-side .pb div { height:100%; background:#6366F1; }

    /* ===== LIQUID GLASS override (TV overview) ===== */
    body.tv-mode { background:#070B18; }
    .tv-stage {
      background:
        radial-gradient(820px 560px at 6% -4%,  rgba(99,102,241,.70), transparent 62%),
        radial-gradient(760px 560px at 96% 4%,  rgba(20,184,166,.55), transparent 62%),
        radial-gradient(900px 640px at 62% 104%, rgba(168,85,247,.55), transparent 62%),
        radial-gradient(640px 520px at -2% 92%, rgba(37,99,235,.50), transparent 62%),
        radial-gradient(520px 380px at 48% 46%, rgba(236,72,153,.16), transparent 70%),
        #0A1020;
    }
    .tv-kpi, .tv-col, .tv-jcard {
      background: linear-gradient(135deg, rgba(255,255,255,.17) 0%, rgba(255,255,255,.05) 45%, rgba(255,255,255,.09) 100%);
      -webkit-backdrop-filter: blur(24px) saturate(185%); backdrop-filter: blur(24px) saturate(185%);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.06), inset 1px 0 0 rgba(255,255,255,.12), 0 10px 36px rgba(2,6,23,.40);
      border-radius: 22px;
    }
    .tv-kpi { border-radius: 20px; }
    .tv-head button {
      background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.08));
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.35); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 14px rgba(2,6,23,.3);
    }
    .tv-head h1 { text-shadow: 0 2px 18px rgba(255,255,255,.25); }
    .tv-sec { color: rgba(255,255,255,.72); }

<div id="app"><div style="text-align:center; padding: 40px; color: #64748B;">กำลังโหลดข้อมูล...</div></div>

<script>
// ====================================================================
// 1. CONFIGURATION
// ====================================================================
// 👉 วาง URL ของ Google Apps Script ที่ Deploy ใหม่ตรงนี้
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOKoAWg1m7APSzL5_8ejzPMjj_CHICSCWcfMJ_sW4B2ds6KRO2sPvZrRdh5xqbltLR/exec';
// 👉 ต้องตรงกับ APP_TOKEN ใน Code.gs ทุกตัวอักษร
const APP_TOKEN = 'MatcoM1234';

const MODELS = ['D46H', 'D41H', '578W', 'New Drum', 'Drum D46H'];
const SIDES = ['LH', 'RH'];
// รุ่นที่ไม่มีข้างซ้าย/ขวา -> ใช้ค่า side = '-' ใน Sheet (1 แถวต่อรุ่น)
const NO_SIDE = '-';
const NO_SIDE_MODELS = ['New Drum', 'Drum D46H'];
function sidesOf(m) { return NO_SIDE_MODELS.includes(m) ? [NO_SIDE] : SIDES; }
function sideLabel(s) { return s === NO_SIDE ? '' : s; }

// แผนก/สิทธิ์การมองเห็นหน้าต่างๆ
const ROLES = {
  top:   { label: 'Top Management', allowed: ['overview', 'plan'] },
  paint: { label: 'Paint (Production)', allowed: ['overview', 'paint', 'plan'] },
  pe:    { label: 'PE',             allowed: ['overview', 'maintenance', 'plan'] }
};
// ใครแก้ไข Status ในหน้าแผนได้บ้าง (Paint = Production เป็นคนกรอก)
const PLAN_EDIT_ROLES = ['paint'];
const AGING_WARN_DAYS = 2;   // ค้างเกินกี่วัน -> เตือนสีเหลือง
const AGING_CRIT_DAYS = 4;   // ค้างเกินกี่วัน -> เตือนสีแดง
const POLL_INTERVAL_MS = 15000;

let state = { tickets: [], inventory: [], serverTime: 0 };
let pendingOps = [];        // action ที่ยังไม่ยืนยันจาก server (เก็บไว้ retry)
let syncStatus = 'idle';    // idle | syncing | error

// ====================================================================
// 2. USER IDENTITY (แก้ปัญหา: ไม่มี audit trail ว่าใครทำรายการ)
// ====================================================================
function getUserName() { return localStorage.getItem('jig_user_name') || ''; }
function setUserName(name) { localStorage.setItem('jig_user_name', name.trim()); }
function getUserRole() { return localStorage.getItem('jig_user_role') || ''; }
function setUserRole(role) { localStorage.setItem('jig_user_role', role); }

function renderUserGate() {
  const preselected = uiState_gateRole || '';
  document.getElementById('app').innerHTML = `
    <div class="gate-wrap">
      <p class="eyebrow">Digital Factory Hub</p>

      <input id="gateName" placeholder="เช่น สมชาย (Paint กะเช้า)" maxlength="50">
      <div class="field" style="text-align:left; margin-top:4px;">

        </div>

}
let uiState_gateRole = '';
window.selectGateRole = function(key) {
  uiState_gateRole = key;
  document.querySelectorAll('#gateRoleRow .chip').forEach(b => b.classList.toggle('chip-active', b.dataset.role === key));
};
window.submitUserGate = function() {
  const v = document.getElementById('gateName').value.trim();
  if (!v) { showToast('กรุณากรอกชื่อ', true); return; }

};

// ====================================================================
// 3. DATA LAYER — Action-based sync (ไม่ push state ทั้งก้อนอีกต่อไป)
// ====================================================================
function loadLocal() {
  try {
    const raw = localStorage.getItem('jig_state_v7');
    if (raw) state = JSON.parse(raw);
    const rawQ = localStorage.getItem('jig_pending_ops_v7');
    if (rawQ) pendingOps = JSON.parse(rawQ);
  } catch (e) {}
}
function saveLocal() {
  localStorage.setItem('jig_state_v7', JSON.stringify(state));
  localStorage.setItem('jig_pending_ops_v7', JSON.stringify(pendingOps));
}

function genOpId() {
  return (crypto.randomUUID ? crypto.randomUUID() : 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2));
}

// ส่ง action หนึ่งคำสั่งไปยัง server เสมอ (ไม่ใช่ whole-state)
// คืนค่า Promise<{success, error?, result?}>
async function sendAction(action, payload) {
  const op = { opId: genOpId(), action, by: getUserName(), token: APP_TOKEN, ts: Date.now(), ...payload };
  pendingOps.push(op);
  saveLocal();
  renderSyncBadgeOnly();
  const res = await flushPendingOps();
  return res;
}

async function flushPendingOps() {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('ใส่_URL')) {
    return { success: false, error: 'ยังไม่ได้ตั้งค่า GOOGLE_SCRIPT_URL' };
  }
  if (pendingOps.length === 0) return { success: true };

  syncStatus = 'syncing'; renderSyncBadgeOnly();
  let lastResult = { success: true };

  while (pendingOps.length > 0) {
    const op = pendingOps[0];
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(op)
      });
      const json = await res.json();
      if (json.success) {
        if (json.data) {
          state.tickets = json.data.tickets || [];
          state.inventory = json.data.inventory || [];
          state.serverTime = json.data.serverTime || Date.now();
        }
        pendingOps.shift(); // ยืนยันแล้ว เอาออกจากคิว
        saveLocal();
        lastResult = { success: true, result: json.result };
      } else {
        // server ปฏิเสธ action นี้ (เช่น validation fail) — เอาออกจากคิวเลย ไม่ retry ซ้ำ
        pendingOps.shift();
        saveLocal();
        syncStatus = 'error';
        return { success: false, error: json.error || 'unknown server error' };
      }
    } catch (err) {
      // เน็ตหลุด/ออฟไลน์ — เก็บ op ไว้ในคิว รอ retry รอบหน้า ไม่ทำอะไรกับ state ต่อ
      syncStatus = 'error';
      renderSyncBadgeOnly();
      return { success: false, error: 'ออฟไลน์ — จะ sync อัตโนมัติเมื่อกลับมาต่อเน็ตได้' };
    }
  }
  syncStatus = 'idle';
  renderSyncBadgeOnly();
  return lastResult;
}

function fetchFromSheets(silent = true) {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('ใส่_URL')) return;
  // ถ้ามี pending ops ค้างอยู่ ให้ flush ก่อน ไม่ควร overwrite state ด้วย read เฉยๆ
  if (pendingOps.length > 0) { flushPendingOps().then(() => route()); return; }

  fetch(GOOGLE_SCRIPT_URL + '?action=load')
    .then(res => res.json())
    .then(res => {
      if (res.success && res.data) {
        state.tickets = res.data.tickets || [];
        state.inventory = res.data.inventory || [];
        state.serverTime = res.data.serverTime || Date.now();
        saveLocal();
        route();
      }
    })
    .catch(() => { if (!silent) showToast('ออฟไลน์ — แสดงข้อมูลล่าสุดที่เคยโหลดไว้', true); });
}

window.addEventListener('online', () => flushPendingOps().then(() => route()));
setInterval(() => fetchFromSheets(true), POLL_INTERVAL_MS);

function renderSyncBadgeOnly() {
  const el = document.getElementById('syncBadge');
  if (el) { el.outerHTML = syncIndicatorHtml(); }
}
function syncIndicatorHtml() {
  let cls = 'sync-indicator', txt;
  if (pendingOps.length > 0) { cls += ' pending'; txt = `⏳ รอ sync ${pendingOps.length} รายการ`; }
  else if (syncStatus === 'error') { cls += ' error'; txt = '⚠️ ออฟไลน์ / sync ล้มเหลว'; }
  else {
    const d = new Date(state.serverTime || Date.now());
    txt = `✅ Synced ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  }
  return `<div class="sync-indicator ${cls.replace('sync-indicator','').trim()}" id="syncBadge">${txt}</div>`;
}

// ====================================================================
// 4. CORE LOGIC (read-only helpers — คำนวณจาก server state)
// ====================================================================
function getInventory(m, s) {
  const item = state.inventory.find(i => i.model === m && i.side === s);
  return item ? item.total : 0;
}

function getConsolidatedStats(m, s) {
  let ts = state.tickets.filter(t => t.model === m && t.side === s);
  let sent = 0, done = 0, rec = 0, ng = 0, oldestPendingAt = null;
  ts.forEach(t => {
    sent += t.totalQty; done += t.completedQty; rec += (t.receivedQty || 0);
    if (t.kind === 'ng' && t.completedQty < t.totalQty) ng += (t.totalQty - t.completedQty);
    if (t.completedQty < t.totalQty) {
      if (!oldestPendingAt || new Date(t.createdAt) < new Date(oldestPendingAt)) oldestPendingAt = t.createdAt;
    }
  });
  return { sent, done, rec, pendingMaint: sent - done, readyForPaint: done - rec, ngPending: ng, oldestPendingAt };
}

function daysSince(iso) {
  if (!iso) return 0;
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function agingBadge(iso) {
  const d = daysSince(iso);
  if (d >= AGING_CRIT_DAYS) return `<span class="aging-badge aging-critical">ค้าง ${d} วัน</span>`;
  if (d >= AGING_WARN_DAYS) return `<span class="aging-badge aging-warn">ค้าง ${d} วัน</span>`;
  return `<span class="aging-badge aging-ok">ค้าง ${d} วัน</span>`;
}
function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ====================================================================
// 5. ACTIONS (มี validation ฝั่ง client ก่อนยิง + disable ปุ่มกันกดซ้ำ)
// ====================================================================
window.submitTicket = async function(kind, btn) {

  else showToast('❌ ' + res.error, true);
  route();
};

window.submitProgressFIFO = async function(m, s, btn) {
  const input = document.getElementById(`mqty_${m}_${s}`);
  const applyQty = parseInt(input.value);
  if (!applyQty || applyQty <= 0) { showToast('กรุณากรอกจำนวน', true); return; }
  const st = getConsolidatedStats(m, s);
  if (applyQty > st.pendingMaint) { showToast(`❌ เกินยอดค้างซ่อมจริง (มีแค่ ${st.pendingMaint} ชิ้น)`, true); return; }
  btn.disabled = true;
  const res = await sendAction('progress', { model: m, side: s, qty: applyQty });
  btn.disabled = false;
  if (res.success) {
    if (res.result && res.result.excess > 0) showToast(`⚠️ บันทึกได้ ${res.result.applied} ชิ้น (เกินยอดจริง ${res.result.excess} ชิ้น ไม่ถูกนับ)`, true);
    else showToast('✅ PE อัปเดตยอดซ่อมสำเร็จ');
  } else showToast('❌ ' + res.error, true);
  route();
};

window.submitReceiveFIFO = async function(m, s, btn) {
  const input = document.getElementById(`rqty_${m}_${s}`);
  const applyQty = parseInt(input.value);
  if (!applyQty || applyQty <= 0) { showToast('กรุณากรอกจำนวน', true); return; }
  const st = getConsolidatedStats(m, s);
  if (applyQty > st.readyForPaint) { showToast(`❌ เกินยอดที่รอรับจริง (มีแค่ ${st.readyForPaint} ชิ้น)`, true); return; }
  btn.disabled = true;
  const res = await sendAction('receive', { model: m, side: s, qty: applyQty });
  btn.disabled = false;
  if (res.success) {
    if (res.result && res.result.excess > 0) showToast(`⚠️ รับได้ ${res.result.applied} ชิ้น (เกินยอดจริง ${res.result.excess} ชิ้น ไม่ถูกนับ)`, true);
    else showToast('✅ รับคืนเข้าระบบ Stock สำเร็จ');
  } else showToast('❌ ' + res.error, true);
  route();
};

window.setInventory = async function(m, s, val, btn) {
  const total = Number(val);
  if (isNaN(total) || total < 0) { showToast('จำนวนสต็อกต้องเป็นตัวเลข ≥ 0', true); return; }
  btn.disabled = true;

window.cancelTicket = async function(id, btn) {

// ====================================================================
// 6. UI COMPONENTS
// ====================================================================
function showToast(msg, isError) {
  const t = document.createElement('div');
  t.className = 'toast show' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}
function fmtTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('th-TH', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

// ---- Progressive circular % success ring ----
// สร้าง SVG donut ที่ค่อยๆ ไล่ระดับ (progressive) เข้าสู่ค่า % จริงตอนแสดงผล
let __ringSeq = 0;
function progressRingHtml(pct, opts = {}) {
  const size = opts.size || 88;
  const stroke = opts.stroke || 9;
  const color = opts.color || 'var(--accent)';
  const track = opts.track || 'rgba(148,163,184,0.25)';
  const label = opts.label || '';
  const r = (size - stroke) / 2;
  const c = +(2 * Math.PI * r).toFixed(2);
  const clamped = Math.max(0, Math.min(100, pct || 0));
  const id = 'ring_' + (__ringSeq++);
  return `
    <div class="ring-wrap" style="width:${size}px;height:${size}px;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track}" stroke-width="${stroke}" fill="none"/>
        <circle id="${id}" class="ring-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
          stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
          transform="rotate(-90 ${size/2} ${size/2})" data-circ="${c}" data-pct="${clamped}"></circle>
      </svg>
      <div class="ring-label" style="font-size:${Math.round(size*0.24)}px;">
        <span class="n" data-ring-num="${id}">0%</span>
        ${label ? `<span class="u">${label}</span>` : ''}
      </div>
    </div>
  `;
}
// เรียกหลังจาก innerHTML ถูกแทรกแล้ว เพื่อให้ transition ของ stroke-dashoffset ทำงาน (progressive fill)
// และนับตัวเลข % ไล่ขึ้นแบบ progressive เช่นกัน
function animateProgressRings() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ring-fill').forEach(circle => {
      const c = parseFloat(circle.dataset.circ);
      const pct = parseFloat(circle.dataset.pct);
      const targetOffset = c - (pct / 100) * c;
      circle.style.strokeDashoffset = targetOffset;

      const numEl = document.querySelector(`[data-ring-num="${circle.id}"]`);
      if (numEl) {
        const dur = 1200, start = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          numEl.textContent = Math.round(pct * eased) + '%';
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
    });
  });
}

let uiState = { paintTab: 'send', maintTab: 'todo', form: { model: MODELS[0], side: SIDES[0] } };

window.route = function() {
  if (!getUserName() || !getUserRole()) { renderUserGate(); return; }

  const allowed = (ROLES[getUserRole()] && ROLES[getUserRole()].allowed) || ['overview'];
  let hash = (window.location.hash || '#home').slice(1);

  // role ที่มีสิทธิ์เห็นแค่หน้าเดียว -> ข้ามเมนูหลักไปหน้านั้นเลย
  if (hash === 'home' && allowed.length === 1) { window.location.hash = allowed[0]; return; }
  // กันเข้าหน้าที่ role ไม่มีสิทธิ์ (hash ค้างจากตอนเปลี่ยน role หรือพิมพ์ URL เอง)
  if (hash !== 'home' && !allowed.includes(hash)) { window.location.hash = 'home'; return; }

  if (hash !== 'overview') { document.body.classList.remove('desktop-fit'); document.body.classList.remove('tv-mode'); }
  if (hash === 'paint') renderPaint();
  else if (hash === 'maintenance') renderMaint();
  else if (hash === 'overview') renderOverview();
  else if (hash === 'plan') renderPlan();
  else renderHome();
  renderUserPill();
};

  { key: 'QC Check',   color: '#EAB308' },
  { key: 'Re-trial',   color: '#F97316' },
  { key: 'Big lot',    color: '#3B82F6' },
  { key: 'Trial',      color: '#8B5CF6' },
  { key: 'Pending',    color: '#94A3B8' }
];
const PLAN_STATUS_FLOW = [...PLAN_STATUS_TOP_DOWN].reverse(); // ลำดับขั้นตอนจริง ใช้ใน dropdown
function statusColor(k) { return (PLAN_STATUS_TOP_DOWN.find(x => x.key === k) || {}).color || '#94A3B8'; }

let planState = { entries: [] };   // { id, no, status, date:'YYYY-MM-DD', by, ts }
let planQueue = [];                // ops ที่ยังไม่ได้ sync ไป server
let planSyncOk = null;             // null=ยังไม่รู้ true=server รองรับ false=เก็บในเครื่องเท่านั้น
let planUI = { tab: 'update', model: 'all', date: '', month: '', sel: {} };

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function canEditPlan() { return PLAN_EDIT_ROLES.includes(getUserRole()); }
function planLoadLocal() {
  try { const r = localStorage.getItem('jig_plan_v1'); if (r) planState = JSON.parse(r); const q = localStorage.getItem('jig_plan_q_v1'); if (q) planQueue = JSON.parse(q); } catch (e) {}
}
function planSaveLocal() {
  localStorage.setItem('jig_plan_v1', JSON.stringify(planState));
  localStorage.setItem('jig_plan_q_v1', JSON.stringify(planQueue));
}
// สถานะปัจจุบันของแต่ละรายการ = entry ล่าสุด (เรียงตามวันที่ แล้วตามเวลาที่กรอก)
function planCurrent(no) {
  const list = planState.entries.filter(e => e.no === no).sort((a, b) => (a.date + String(a.ts).padStart(15,'0')).localeCompare(b.date + String(b.ts).padStart(15,'0')));
  return list.length ? list[list.length - 1] : null;
}

async function planFlush() {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('ใส่_URL')) return;
  while (planQueue.length) {
    const op = planQueue[0];
    try {
      const res = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...op, token: APP_TOKEN, by: getUserName() }) });
      const j = await res.json();
      if (j.success) { planQueue.shift(); planSyncOk = true; }
      else { planSyncOk = false; break; }       // server ยังไม่รองรับ action ของแผน -> เก็บในเครื่องไว้
    } catch (e) { break; }                      // ออฟไลน์ -> retry รอบหน้า
  }
  planSaveLocal();
}
async function planFetch() {
  if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes('ใส่_URL')) return;
  await planFlush();
  if (planQueue.length) return;                 // ยังมีของค้างส่ง ไม่ overwrite
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL + '?action=planLoad');
    const j = await res.json();
    if (j.success && Array.isArray(j.entries)) { planState.entries = j.entries; planSyncOk = true; planSaveLocal(); }
    else planSyncOk = false;
  } catch (e) {}
}
setInterval(() => { if (['plan', 'overview'].includes((location.hash || '').slice(1))) planFetch().then(() => { if (!document.activeElement || document.activeElement.tagName !== 'SELECT') route(); }); }, POLL_INTERVAL_MS);

window.planSetStatus = async function(no, btn) {
  const sel = document.getElementById('pst_' + no);
  const date = document.getElementById('planDate').value || todayStr();
  const entry = { id: genOpId(), no, status: sel.value, date, by: getUserName(), ts: Date.now() };
  delete planUI.sel[no];
  planState.entries.push(entry);
  planQueue.push({ action: 'planAdd', entry });
  planSaveLocal(); route();
  showToast('✅ บันทึก #' + no + ' → ' + entry.status);
  planFlush().then(() => route());
};
window.planRemove = async function(id) {
  if (!canEditPlan()) return;
  if (!confirm('ลบรายการ status นี้ใช่ไหม?')) return;
  planState.entries = planState.entries.filter(e => e.id !== id);
  planQueue.push({ action: 'planRemove', id });
  planSaveLocal(); route();
  planFlush().then(() => route());
};

// ---- วงกลม % แบบนิ่ง (ไม่ animate) สำหรับจอ TV ที่รีเฟรชทุก 15 วิ ไม่ให้กระพริบ ----
function staticRing(pct, size, stroke, color, track) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  const v = Math.max(0, Math.min(100, pct || 0)), off = c - v / 100 * c;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${track || 'rgba(255,255,255,0.18)'}" stroke-width="${stroke}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="ring-label" style="font-size:${Math.round(size * 0.27)}px;"><span class="n">${v}%</span></div></div>`;
}

function renderOverviewTV() {
  document.body.classList.add('tv-mode'); document.body.classList.remove('desktop-fit');
  // ----- Jig & Drum totals -----
  let allSent = 0, allDone = 0, allStock = 0, oldest = null, oldestKey = '';
  const jigCards = MODELS.map(m => {
    let mDone = 0, mStock = 0;
    const sides = sidesOf(m).map(sd => {
      const st = getConsolidatedStats(m, sd), inv = getInventory(m, sd);
      allSent += st.sent; allDone += st.done; allStock += inv; mDone += st.done; mStock += inv;
      if (st.oldestPendingAt && (!oldest || new Date(st.oldestPendingAt) < new Date(oldest))) { oldest = st.oldestPendingAt; oldestKey = `${m} ${sideLabel(sd)}`.trim(); }
      const pct = st.sent > 0 ? Math.round(st.done / st.sent * 100) : 0;
      return { sd, st, inv, pct };
    });
    const html = sides.map(x => `<div class="tv-side">
        <div class="sl">${x.sd === 'LH' ? 'LH (ซ้าย)' : x.sd === 'RH' ? 'RH (ขวา)' : 'ไม่แยกซ้าย/ขวา'} <span style="margin-left:auto;font-weight:500;color:#94A3B8;">Stock <b style="font-family:'IBM Plex Mono';color:#F1F5F9;">${x.inv}</b></span> ${x.st.oldestPendingAt ? agingBadge(x.st.oldestPendingAt) : ''}</div>
        <div class="nums">
          <div><b>${x.st.sent}</b><span>ส่งซ่อม</span></div>
          <div><b style="color:#34D399">${x.st.done}</b><span>ซ่อมเสร็จ</span></div>
          <div><b style="color:#F87171">${x.st.pendingMaint}</b><span>ค้างซ่อม</span></div>
          <div><b style="color:#FBBF24">${x.st.readyForPaint}</b><span>รอรับคืน</span></div>
        </div>
        <div class="pb"><div style="width:${x.pct}%"></div></div></div>`).join('');
    const mp = mStock > 0 ? Math.round(mDone / mStock * 100) : 0;
    return `<div class="tv-jcard"><div class="top"><div class="name">${m}</div>${staticRing(mp, 46, 5, '#818CF8')}</div>${html}</div>`;
  }).join('');
  const allPctStock = allStock > 0 ? Math.round(allDone / allStock * 100) : 0;

  // ----- Plan (ต่อรุ่น: รายการ + ขั้นตอน + status + วันที่) -----
  const cur = it => planCurrent(it.no);
  let planDone = 0;
  const planCols = PLAN_MODELS.map(m => {
    const items = PLAN_ITEMS.filter(i => i.model === m);
    const counts = {}; PLAN_STATUS_TOP_DOWN.forEach(x => counts[x.key] = 0);
    items.forEach(it => { const c = cur(it); counts[c ? c.status : 'Pending']++; });
    const sop = counts['SOP'] + counts['Shipment']; planDone += sop;
    const pct = items.length ? Math.round(sop / items.length * 100) : 0;
    const bar = PLAN_STATUS_FLOW.filter(x => counts[x.key]).map(x => `<div style="width:${counts[x.key] / items.length * 100}%;background:${x.color}"></div>`).join('');
    const chips = PLAN_STATUS_TOP_DOWN.map(x => `<div class="tv-chip ${counts[x.key] ? '' : 'zero'}" style="--sc:${x.color}"><b>${counts[x.key]}</b><span>${x.key}</span></div>`).join('');
    const rank = it => { const c = cur(it); const i = PLAN_STATUS_TOP_DOWN.findIndex(x => x.key === (c ? c.status : 'Pending')); return i < 0 ? 99 : i; };
    // มี status ก้าวหน้าแล้วขึ้นบน: เรียง Shipment → SOP → ... → Pending (ในสถานะเดียวกันเรียงตามลำดับแผน)
    const sorted = items.slice().sort((x, y) => rank(x) - rank(y) || x.no - y.no);
    const rows = sorted.map(it => {
      const c = cur(it), st = c ? c.status : 'Pending';
      const idx = PLAN_STATUS_FLOW.findIndex(x => x.key === st), col = statusColor(st);
      const dots = PLAN_STATUS_FLOW.map((x, i) => `<i style="${i <= idx ? 'background:' + col : ''}"></i>`).join('');
      return `<div class="tv-item"><span class="color">${escapeHtml(it.color)}</span><span class="dots">${dots}</span>
        <span class="pill" style="--sc:${col}">${st}</span>

  document.getElementById('app').innerHTML = `
    <div class="tv-stage" id="tvStage">
      <div class="tv-head">
        <button onclick="location.hash='home'">← เมนูหลัก</button>
        <h1>OVERVIEW DASHBOARD</h1>
        ${syncIndicatorHtml()}
        <button onclick="planFetch(); fetchFromSheets(false)">↻ รีเฟรช</button>
        <div class="clock" id="tvClock">${new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</div>
      </div>
      <div class="tv-kpis">
        ${kpi('Jig ทั้งหมด<br>ใน Stock', allStock)}
        ${kpi('ส่งซ่อมรวม', allSent)}
        ${kpi('ซ่อมเสร็จแล้ว', allDone, '#34D399')}
        ${kpi('ค้างซ่อม (PE)', allSent - allDone, '#F87171')}
        <div class="tv-kpi"><div class="l">% สำเร็จ<br>เทียบ Stock</div>${staticRing(allPctStock, 64, 7, '#60A5FA')}</div>
        <div class="tv-kpi"><div class="l">แผน SOP แล้ว<br><b style="font-family:'IBM Plex Mono';font-size:20px;color:#F1F5F9;">${planDone} / ${PLAN_ITEMS.length}</b></div>${staticRing(planPct, 64, 7, '#2DD4BF')}</div>
        <div class="tv-kpi" style="${oldest ? 'border-color:#7F1D1D;' : ''}"><div class="l">ค้างนานสุด</div><div style="text-align:right;font-weight:700;font-size:18px;">${oldest ? escapeHtml(oldestKey) + '<br>' + agingBadge(oldest) : '—'}</div></div>
      </div>
      <div><div class="tv-sec">แผนการผลิต · STATUS &amp; วันที่ (แต่ละรุ่น)</div><div class="tv-plan">${planCols}</div></div>
      <div><div class="tv-sec">สถานะ Jig &amp; Drum (ส่งซ่อม)</div><div class="tv-jig">${jigCards}</div></div>
    </div>`;
  fitTV();
}

function renderOverviewMobile() {

      if (st.oldestPendingAt && (!oldestGlobal || new Date(st.oldestPendingAt) < new Date(oldestGlobal))) {
        oldestGlobal = st.oldestPendingAt; oldestGlobalKey = `${m} ${sideLabel(s)}`.trim();

      let pctDone = st.sent > 0 ? Math.round((st.done / st.sent) * 100) : 0;

            <div style="font-size: 16px; font-weight: 700;">${s === 'LH' ? 'LH (ซ้าย)' : s === 'RH' ? 'RH (ขวา)' : 'ไม่แยกซ้าย/ขวา'} ${st.oldestPendingAt ? agingBadge(st.oldestPendingAt) : ''}</div>

    let modelPctStock = modelStock > 0 ? Math.round((modelDone / modelStock) * 100) : 0;

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
        <div style="font-family: Oswald; font-size: 22px; font-weight: 700; color:var(--accent); border-bottom:2px solid var(--accent); display:inline-block;">${m}</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="text-align:right;">
            <div class="lbl" style="font-size:10px; color:var(--ink-soft); text-transform:uppercase;">% สำเร็จ<br>(เทียบ Stock)</div>
          </div>
          ${progressRingHtml(modelPctStock, { size: 56, stroke: 6, color: 'var(--accent)' })}

  let allPctStock = allStock > 0 ? Math.round((allDone / allStock) * 100) : 0;
  let escalateHtml = oldestGlobal ? `
    <div class="form-card" style="border-left:6px solid var(--red);">
      <div style="font-size:12px; color:var(--ink-soft); text-transform:uppercase; margin-bottom:4px;">ต้องเร่งดูก่อน (ticket ค้างนานสุด)</div>
      <div style="font-weight:700; font-size:16px;">${oldestGlobalKey} ${agingBadge(oldestGlobal)}</div>
    </div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="role-header bg-overview">
      <div class="role-header-top">
        <button class="home-link" onclick="location.hash='home'">← เมนูหลัก</button>
        <button class="refresh-pill" onclick="fetchFromSheets(false)">↻ รีเฟรช</button>
      </div>
      <p class="eyebrow" style="color:#94A3B8;">Management View</p>
      <h1>OVERVIEW DASHBOARD</h1>
      ${syncIndicatorHtml()}
    </div>
    <div id="overviewContentOuter">
      <div class="content" id="overviewContent">
        <div class="overall-card">
          <div class="overall-title">สรุปยอดรวมทุกรุ่น (All Models)</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 16px;">
            <div><div style="font-size:12px; color:#CBD5E1;">Jig ทั้งหมดทุกโมเดล (Total Stock)</div></div>
            <div style="font-family:'IBM Plex Mono'; font-size:28px; font-weight:700;">${allStock} ชิ้น</div>
          </div>
          <div style="display:flex; justify-content:space-around; align-items:center;">
             <div style="text-align:center;"><div style="font-size:12px; color:#CBD5E1;">ส่งซ่อมรวม</div><div style="font-family:'IBM Plex Mono'; font-size:30px; font-weight:700;">${allSent}</div></div>
             <div style="text-align:center;"><div style="font-size:12px; color:#10B981;">ทำเสร็จแล้ว</div><div style="font-family:'IBM Plex Mono'; font-size:30px; font-weight:700; color:#34D399;">${allDone}</div></div>
             <div style="text-align:center;"><div style="font-size:12px; color:#FCA5A5;">ค้างซ่อม (PE)</div><div style="font-family:'IBM Plex Mono'; font-size:30px; font-weight:700; color:#F87171;">${allSent - allDone}</div></div>
          </div>

            ${progressRingHtml(allPctStock, { size: 92, stroke: 9, color: '#60A5FA', track: 'rgba(255,255,255,0.15)' })}
            <div class="ring-meta">
              <div class="t">% ความสำเร็จรวม</div>
              <div class="d">ทำเสร็จแล้ว ${allDone} / Jig ทั้งหมดทุกโมเดล ${allStock} ชิ้น</div>
            </div>
          </div>
          <div style="font-size:12px; color:#34D399; font-weight:700;">ความสำเร็จของงานที่ส่งซ่อม (Done / ส่งซ่อม): ${allPct}%</div>
          <div class="progress-bg" style="background:rgba(255,255,255,0.2); margin-top:8px; height:10px;">
            <div class="progress-fill" style="background:#34D399; width:${allPct}%"></div>
          </div>
        </div>
        ${escalateHtml}
        ${planOverviewHtml()}
        <div class="models-grid">${modelsHtml}</div>
      </div>
    </div>
  `;
  adjustOverviewFit();
  animateProgressRings();
}

// ปรับสเกลเนื้อหา Overview ให้พอดี 1 หน้าจอบน PC โดยไม่ต้องเลื่อนขึ้นลง
function adjustOverviewFit() {
  const header = document.querySelector('.role-header');
  const outer = document.getElementById('overviewContentOuter');
  const content = document.getElementById('overviewContent');
  if (!header || !outer || !content) return;

  const isDesktop = window.innerWidth > 900;
  document.body.classList.toggle('desktop-fit', isDesktop);

  if (!isDesktop) {
    content.style.transform = '';
    outer.style.height = '';
    outer.style.overflow = '';
    return;
  }

  // reset ก่อนวัดขนาดจริง
  content.style.transform = 'none';
  outer.style.height = 'auto';
  outer.style.overflow = 'visible';

  requestAnimationFrame(() => {
    const headerH = header.getBoundingClientRect().height;
    const availableH = Math.max(window.innerHeight - headerH - 16, 200);
    const naturalH = content.scrollHeight;
    const scale = naturalH > 0 ? Math.min(availableH / naturalH, 1) : 1;

    content.style.transform = `scale(${scale})`;
    outer.style.height = (naturalH * scale) + 'px';
    outer.style.overflow = 'hidden';
  });
}

function renderPaint() {
  const tab = uiState.paintTab;
  let content = '';

  if (tab === 'send' || tab === 'ng') {
    const isNg = tab === 'ng';
    let recentSent = state.tickets.filter(t => t.kind === (isNg ? 'ng' : 'normal') && t.status !== 'received')
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8);

    let historyHtml = recentSent.length > 0 ?
      `<div style="margin-top: 24px;"><h3 class="list-heading">ประวัติการส่งล่าสุด (ยังไม่ได้รับคืน)</h3>` +
      recentSent.map(t => {
        const canCancel = t.completedQty === 0 && t.receivedQty === 0;
        return `<div class="ticket-row">
          <div class="tr-main">
            <div class="tr-model">${t.model} ${sideLabel(t.side)} ${isNg ? '<span style="color:red">(NG)</span>' : ''} ${agingBadge(t.createdAt)}</div>
            ${t.note ? `<div class="tr-note">📝 ${escapeHtml(t.note)}</div>` : ''}
            <div class="tr-by">โดย ${escapeHtml(t.createdBy || '-')} • <span class="tr-time">${fmtTime(t.createdAt)}</span></div>
          </div>
          <div style="text-align:right;">
            <div class="tr-qty">ส่ง ${t.totalQty} ชิ้น</div>
            ${canCancel ? `<button class="cancel-btn" style="margin-top:6px;" onclick="cancelTicket('${t.id}', this)">ยกเลิก</button>` : ''}
          </div>
        </div>`;
      }).join('') + `</div>`
      : '';

    content = `
      <div class="form-card">
        <div class="field"><label>1. เลือกรุ่นรถ (Model)</label>
          <div class="chip-row">${MODELS.map(m => `<button class="chip ${m===uiState.form.model?'chip-active':''}" onclick="uiState.form.model='${m}'; uiState.form.side=sidesOf('${m}')[0]; route()">${m}</button>`).join('')}</div>
        </div>
        ${NO_SIDE_MODELS.includes(uiState.form.model) ? '' : `<div class="field"><label>2. เลือกข้าง (Side)</label>
          <div class="chip-row">${SIDES.map(s => `<button class="chip ${s===uiState.form.side?'chip-active':''}" onclick="uiState.form.side='${s}';route()">${s}</button>`).join('')}</div>
        </div>`}
        <div class="field"><label>3. จำนวนชิ้น (Qty)</label><input type="number" id="formQty" placeholder="ระบุตัวเลข" min="1"></div>
        <div class="field"><label>4. หมายเหตุ (Note)</label><input type="text" id="formNote" placeholder="${isNg ? 'อาการ NG เช่น เบ้าแตก' : 'เช่น ส่งของล็อตเช้า'}"></div>
        <button class="save-btn ${isNg?'ng-btn':''}" onclick="submitTicket('${isNg?'ng':'normal'}', this)">${isNg ? 'บันทึกส่งซ่อม NG' : 'บันทึกส่งงานปกติ'}</button>
      </div>
      ${historyHtml}
    `;
  } else if (tab === 'receive') {
    let readyHtml = [];
    MODELS.forEach(m => sidesOf(m).forEach(s => {
      let st = getConsolidatedStats(m, s);
      if (st.readyForPaint > 0) {
        readyHtml.push(`
          <div class="cons-card">
            <div class="cons-head">
              <span class="cons-title">${m} <span class="cons-sub">${sideLabel(s)}</span></span>
              <span style="font-size:12px; font-weight:700; color:var(--accent-maint); background:#FEF3C7; padding:4px 8px; border-radius:12px;">PE ส่งคืน</span>
            </div>
            <div class="cons-stat-row">
              <div>จำนวนที่รอรับเข้า Stock: <span class="highlight-green">${st.readyForPaint}</span> ชิ้น</div>
            </div>
            <div style="display:flex; gap:10px;">
              <input type="number" id="rqty_${m}_${s}" value="${st.readyForPaint}" max="${st.readyForPaint}" min="1" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:6px; font-family:'IBM Plex Mono'; font-size:16px;">
              <button class="save-btn" style="flex:1;" onclick="submitReceiveFIFO('${m}','${s}', this)">ยืนยันรับเข้า Stock</button>
            </div>
          </div>
        `);
      }
    }));
    content = readyHtml.length > 0 ? readyHtml.join('') : '<div style="text-align:center;color:#64748B;padding:20px;">ไม่มีงานรอรับคืนจาก PE</div>';
  } else {
    content = MODELS.map(m => sidesOf(m).map(s => `
      <div class="form-card" style="display:flex;align-items:center;gap:12px;padding:12px;">
        <div style="flex:1;font-weight:600;font-size:16px;">${m} <span class="cons-sub">${sideLabel(s)}</span></div>
        <input type="number" id="inv_${m}_${s}" value="${getInventory(m,s)}" min="0" style="width:100px;padding:12px;border:1px solid #E2E8F0;border-radius:6px;text-align:center;font-size:16px; margin-bottom:0;">
        <button class="save-btn" style="width:auto;padding:12px 20px;" onclick="setInventory('${m}','${s}',document.getElementById('inv_${m}_${s}').value, this)">บันทึก</button>
      </div>
    `).join('')).join('');
  }

  document.getElementById('app').innerHTML = `
    <div class="role-header bg-paint">
      <div class="role-header-top"><button class="home-link" onclick="location.hash='home'">← เมนูหลัก</button><button class="refresh-pill" onclick="fetchFromSheets(false)">↻ รีเฟรช</button></div>
      <p class="eyebrow" style="color:rgba(255,255,255,0.7);">Production Layer</p><h1>ฝ่าย PAINT (พ่นสี)</h1>
      ${syncIndicatorHtml()}
    </div>
    <div class="content">
      <div class="tabs">
        <button class="tab-btn ${tab==='send'?'active':''}" onclick="uiState.paintTab='send';route()">ส่งงาน</button>
        <button class="tab-btn ${tab==='receive'?'active':''}" onclick="uiState.paintTab='receive';route()">รับคืน</button>
        <button class="tab-btn ${tab==='ng'?'active':''}" onclick="uiState.paintTab='ng';route()">แจ้ง NG</button>
        <button class="tab-btn ${tab==='settings'?'active':''}" onclick="uiState.paintTab='settings';route()">ฐานข้อมูล Stock</button>
      </div>
      ${content}
    </div>
  `;
}

  let maintHtml = [];
  MODELS.forEach(m => sidesOf(m).forEach(s => {
    let st = getConsolidatedStats(m, s);
    if (st.pendingMaint > 0) {
      let isNg = st.ngPending > 0;
      maintHtml.push(`
        <div class="cons-card" style="${isNg ? 'border-left-color: var(--red);' : ''}">
          <div class="cons-head">
            <span class="cons-title">${m} <span class="cons-sub">${sideLabel(s)}</span> ${st.oldestPendingAt ? agingBadge(st.oldestPendingAt) : ''}</span>

          </div>
          <div class="cons-stat-row">
            <div>ยอดรอซ่อมทั้งหมด: <span class="highlight-red">${st.pendingMaint}</span> ชิ้น</div>
          </div>
          <div style="display:flex; gap:10px;">
            <input type="number" id="mqty_${m}_${s}" placeholder="ซ่อมเสร็จกี่ชิ้น?" max="${st.pendingMaint}" min="1" style="flex:1; padding:10px; border:1px solid var(--line); border-radius:6px; font-size:16px; font-family:'IBM Plex Mono';">
            <button class="save-btn" style="flex:1; background:var(--accent-maint);" onclick="submitProgressFIFO('${m}','${s}', this)">บันทึกงานเสร็จ</button>

    }
  }));

  document.getElementById('app').innerHTML = `
    <div class="role-header bg-maintenance">
      <div class="role-header-top"><button class="home-link" onclick="location.hash='home'">← เมนูหลัก</button><button class="refresh-pill" onclick="fetchFromSheets(false)">↻ รีเฟรช</button></div>
      <p class="eyebrow" style="color:rgba(255,255,255,0.7);">Support Layer</p><h1>ฝ่าย PE</h1>
      ${syncIndicatorHtml()}
    </div>
    <div class="content">
      <h3 class="list-heading" style="font-family:'Oswald'; font-size:18px; margin: 10px 0 16px;">สรุปยอดค้างซ่อม (แบ่งตามรุ่น)</h3>
      ${maintHtml.length > 0 ? maintHtml.join('') : '<div style="text-align:center;color:#64748B;padding:40px;background:#fff;border-radius:12px;">ไม่มีงานค้าง เยี่ยมมาก! 🎉</div>'}
    </div>
  `;
}

// ====================================================================
// 7. BOOT
// ====================================================================
function boot() {
  loadLocal();
  planLoadLocal();
  planFetch();
  // เปิดจากจอ PC (>900px) -> เด้งไปหน้า Overview ทันทีเสมอ (ไม่สนใจ hash เดิมที่ค้างไว้)
  if (window.innerWidth > 900) {
    window.location.hash = 'overview';
  } else if (!window.location.hash) {
    window.location.hash = 'home';
  }
  route();
  fetchFromSheets(true);
}
window.addEventListener('hashchange', route);

// เมื่อย่อ/ขยายหน้าต่าง ให้คำนวณสเกลของหน้า Overview ใหม่ (debounce กันเรียกถี่เกินไป)
let __resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(__resizeTimer);
  __resizeTimer = setTimeout(() => {
    if (window.location.hash === '#overview') {
      const wantTV = window.innerWidth > 900;
      if (wantTV !== document.body.classList.contains('tv-mode')) route(); else fitTV();
    }
  }, 120);
});

boot();
</script>
