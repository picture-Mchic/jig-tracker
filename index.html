<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

    :root {
      --paper: #F3F0E8;
      --card: #FFFFFF;
      --ink: #23262B;
      --ink-soft: #6B6A63;
      --line: #DEDACD;

    .home-head .eyebrow { color: var(--ink-soft); }
    .home-head h1 {

<body>
<div id="app"><div class="loading-msg">กำลังโหลด...</div></div>
<script>
// ====================================================================
// 1. CONSTANTS & HELPERS
// ====================================================================
const MODELS = ['D46H','D41H','578W'];
const SIDES = ['LH','RH'];
const STORAGE_PREFIX = 'jig_';

function getKey(type, id) { return `${STORAGE_PREFIX}${type}:${id}`; }

function loadAll(type) {
  const result = [];
  const prefix = getKey(type, '');
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(prefix)) {
      try { result.push(JSON.parse(localStorage.getItem(key))); }
      catch(e) {}
    }
  }
  return result;
}

function loadOne(type, id) {
  try { return JSON.parse(localStorage.getItem(getKey(type, id))); }
  catch(e) { return null; }
}

function saveOne(type, id, data) {
  localStorage.setItem(getKey(type, id), JSON.stringify(data));
}

function getCurrentRole() {
  const hash = location.hash.replace('#', '');
  if (hash === 'overview') return 'overview';
  if (hash === 'paint') return 'paint';
  if (hash === 'maintenance') return 'maintenance';
  return null;
}

function escapeHtml(s) {
  return (s || '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('th-TH', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2200);
}

// ====================================================================
// 2. BUSINESS LOGIC
// ====================================================================
function getTickets(role) {
  const all = loadAll('ticket');
  if (role === 'overview') return all;
  return all.filter(t => t.role === role);
}

function getInventory(model, side) {
  const key = `${model}-${side}`;
  const data = loadOne('inventory', key);
  return data ? data.total : 0;
}

function setInventory(model, side, total) {
  const key = `${model}-${side}`;
  saveOne('inventory', key, { total: Number(total), updatedAt: new Date().toISOString() });
  syncToSheetsSilently();
}

function createTicket(role, model, side, kind, totalQty, note) {
  const id = 'tk_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
  const now = new Date().toISOString();
  const ticket = {
    id, model, side, kind, role,
    totalQty: Number(totalQty),
    completedQty: 0,
    remainingQty: Number(totalQty),
    status: 'pending',
    note: note || '',
    createdAt: now,
    updatedAt: now,
    createdBy: role,
    history: [{ action: 'created', timestamp: now }]
  };
  saveOne('ticket', id, ticket);
  syncToSheetsSilently();
  return ticket;
}

function updateProgress(role, id, additionalQty) {
  const ticket = loadOne('ticket', id);
  if (!ticket) return null;
  const qty = Number(additionalQty);
  if (qty <= 0) return ticket;
  const newCompleted = Math.min(ticket.totalQty, ticket.completedQty + qty);
  const added = newCompleted - ticket.completedQty;
  if (added === 0) return ticket;
  ticket.completedQty = newCompleted;
  ticket.remainingQty = ticket.totalQty - ticket.completedQty;
  ticket.status = ticket.remainingQty === 0 ? 'completed' : 'in_progress';
  ticket.updatedAt = new Date().toISOString();
  ticket.history.push({ action: 'progress', qty: added, timestamp: ticket.updatedAt });
  saveOne('ticket', id, ticket);
  syncToSheetsSilently();
  return ticket;
}

function receiveTicket(role, id) {
  const ticket = loadOne('ticket', id);
  if (!ticket || ticket.status !== 'completed') return null;
  ticket.status = 'received';
  ticket.updatedAt = new Date().toISOString();
  ticket.history.push({ action: 'received', timestamp: ticket.updatedAt });
  saveOne('ticket', id, ticket);
  syncToSheetsSilently();
  return ticket;
}

function getStats(role) {
  const tickets = getTickets(role);
  const stats = { total: 0, pending: 0, in_progress: 0, completed: 0, received: 0, totalQty: 0, completedQty: 0, remainingQty: 0, ngPending: 0 };
  for (const t of tickets) {
    stats.total++;
    if (t.status === 'pending') stats.pending++;
    else if (t.status === 'in_progress') stats.in_progress++;
    else if (t.status === 'completed') stats.completed++;
    else if (t.status === 'received') stats.received++;
    stats.totalQty += t.totalQty;
    stats.completedQty += t.completedQty;
    stats.remainingQty += t.remainingQty;
    if (t.kind === 'ng' && t.status !== 'received') stats.ngPending += t.remainingQty;
  }
  return stats;
}

function getModelStats(role) {
  const result = {};
  for (const model of MODELS) {
    result[model] = {};
    for (const side of SIDES) {
      const tickets = getTickets(role).filter(t => t.model === model && t.side === side);
      let totalQty = 0, completedQty = 0, remainingQty = 0, count = 0;
      for (const t of tickets) {
        totalQty += t.totalQty;
        completedQty += t.completedQty;
        remainingQty += t.remainingQty;
        count++;
      }
      result[model][side] = { totalQty, completedQty, remainingQty, count };
    }
  }
  return result;
}

// ====================================================================
// 3. GOOGLE SHEETS SYNC ENGINE
// ====================================================================
function exportAllData() {
  return { tickets: loadAll('ticket'), inventory: loadAll('inventory'), exportedAt: new Date().toISOString() };
}

function importAllData(data) {
  if (!data) return;
  const allTicketKeys = [];
  const prefix = getKey('ticket', '');
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(prefix)) allTicketKeys.push(key);
  }
  for (const k of allTicketKeys) localStorage.removeItem(k);

  const allInvKeys = [];
  const invPrefix = getKey('inventory', '');
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(invPrefix)) allInvKeys.push(key);
  }
  for (const k of allInvKeys) localStorage.removeItem(k);

  if (data.tickets) {
    for (const t of data.tickets) saveOne('ticket', t.id, t);
  }
  if (data.inventory) {
    for (const inv of data.inventory) {
      const key = inv.id || `${inv.model}-${inv.side}`;
      saveOne('inventory', key, inv);
    }
  }
}

function getScriptUrl() {
  return localStorage.getItem('gsheets_script_url') || '';
}

function syncToSheetsSilently() {
  const url = getScriptUrl();
  if (!url) return;
  const data = exportAllData();
  const fullUrl = `${url}?action=save&data=${encodeURIComponent(JSON.stringify(data))}`;
  
  // ใช้ img/fetch beacon ป้องกันปัญหา CORS
  fetch(fullUrl, { method: 'GET', mode: 'no-cors' })
    .then(() => console.log('Auto-synced to Sheets successfully'))
    .catch(err => console.error('Auto-sync failed:', err));
}

function fetchFromSheets(silent = false) {
  const url = getScriptUrl();
  if (!url) {
    if (!silent) configureSheetsUrl();
    return;
  }
  if (!silent) showToast('🔄 กำลังดึงข้อมูลล่าสุด...');
  fetch(`${url}?action=load`)
    .then(res => res.json())
    .then(res => {
      if (res.success && res.data) {
        importAllData(res.data);
        if (!silent) showToast('✅ อัปเดตข้อมูลสำเร็จ');
        route();
      }
    })
    .catch(err => {
      if (!silent) showToast('❌ ไม่สามารถดึงข้อมูลได้: ' + err.message, 'error');
    });
}

function configureSheetsUrl() {
  const current = getScriptUrl();
  showModal('ตั้งค่าการเชื่อมต่อ Google Sheets', [
    { id: 'url', label: 'Google Apps Script Web App URL', value: current, placeholder: 'https://script.google.com/macros/s/.../exec' }
  ], (data) => {
    if (data.url) {
      localStorage.setItem('gsheets_script_url', data.url.trim());
      showToast('✅ บันทึก URL สำเร็จ กำลังดึงข้อมูล...');
      fetchFromSheets();
    }
  });
}

setInterval(() => {

}, 20000);

function showModal(title, fields, callback) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  let html = `<div class="modal-box"><h3>${escapeHtml(title)}</h3>`;
  for (const f of fields) {
    html += `<label>${escapeHtml(f.label)}</label>`;
    html += `<input type="${f.type||'text'}" id="modal-${f.id}" value="${escapeHtml(f.value||'')}" placeholder="${escapeHtml(f.placeholder||'')}">`;
  }
  html += `<div class="modal-actions">
    <button class="btn-secondary" data-action="modalCancel">ยกเลิก</button>
    <button class="btn-primary" data-action="modalConfirm">ตกลง</button>
  </div></div>`;
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  overlay.querySelector('[data-action="modalCancel"]').addEventListener('click', () => overlay.remove());
  overlay.querySelector('[data-action="modalConfirm"]').addEventListener('click', () => {
    const data = {};
    for (const f of fields) {
      const el = document.getElementById(`modal-${f.id}`);
      if (el) data[f.id] = el.value;
    }
    if (callback) callback(data);
    overlay.remove();
  });
}

function bottomSettingsBar() {
  const hasUrl = Boolean(getScriptUrl());
  return `
    <div class="settings-bar">
      <span class="status-indicator ${hasUrl ? 'connected' : ''}">
        ${hasUrl ? '🟢 เชื่อมต่อ Google Sheets (Auto Sync On)' : '⚪ ยังไม่เชื่อมต่อ Google Sheets'}
      </span>
      <button class="save-btn small-btn" data-action="configSheets">⚙️ ตั้งค่าเชื่อมต่อ</button>
    </div>
  `;
}

function renderMaintTodo(role, tickets) {
  const todo = tickets.filter(t => t.status === 'pending' || t.status === 'in_progress');
  if (!todo.length) return '<div class="empty-note">ไม่มีงานค้าง 🎉</div>';
  return todo.map(t => {
    const pct = t.totalQty > 0 ? Math.round((t.completedQty / t.totalQty) * 100) : 0;
    return `
      <div class="ticket-card ${t.kind === 'ng' ? 'ticket-ng' : ''}">
        <div class="tc-head">
          <span class="tc-model">${t.model} <span class="tr-side">${t.side}</span></span>
          ${t.kind === 'ng' ? '<span class="ng-badge">NG</span>' : ''}
          <span class="tr-status">${t.status === 'pending' ? '⏳ รอเริ่ม' : '🔄 กำลังทำ'}</span>
        </div>
        <div class="tc-body">
          <div class="tc-qty">${t.completedQty} / ${t.totalQty} ชิ้น (เหลือ ${t.remainingQty})</div>
          <div class="tc-progress">
            <div class="tc-progress-bar ${t.kind === 'ng' ? 'ng' : (pct === 100 ? 'done' : '')}" style="width:${pct}%"></div>
          </div>
          ${t.note ? `<div class="tc-note">หมายเหตุ: ${escapeHtml(t.note)}</div>` : ''}
          <div class="tc-time">สร้าง ${fmtTime(t.createdAt)}</div>
          <div class="edit-panel open">
            <div class="field"><label>เพิ่มจำนวนที่ทำเสร็จ</label>
              <input type="number" min="1" max="${t.remainingQty}" id="maintQty-${t.id}" value="${Math.min(1, t.remainingQty)}">
            </div>
            <button class="save-btn" data-action="doUpdateProgress" data-id="${t.id}">อัปเดตความคืบหน้า</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function renderMaintHistory(role, tickets) {
  const hist = tickets.filter(t => t.status === 'completed' || t.status === 'received');
  if (!hist.length) return '<div class="empty-note">ยังไม่มีประวัติ</div>';
  return hist.slice(0,30).map(t => ticketRow(t)).join('');
}

function ticketRow(t) {
  const pct = t.totalQty > 0 ? Math.round((t.completedQty / t.totalQty) * 100) : 0;
  return `
    <div class="ticket-row ${t.kind === 'ng' ? 'ticket-ng' : ''}">
      <div class="tr-main">
        <span class="tr-model">${t.model} <span class="tr-side">${t.side}</span></span>
        ${t.kind === 'ng' ? '<span class="ng-badge">NG</span>' : ''}
      </div>
      <div class="tr-qty">${t.completedQty}/${t.totalQty} (${pct}%)</div>
      <div class="tr-status">${t.status}</div>
      <div class="tr-time">${fmtTime(t.updatedAt)}</div>
    </div>
  `;
}

function ticketCard(t, role) {
  const pct = t.totalQty > 0 ? Math.round((t.completedQty / t.totalQty) * 100) : 0;
  return `
    <div class="ticket-card ${t.kind === 'ng' ? 'ticket-ng' : ''}">
      <div class="tc-head">
        <span class="tc-model">${t.model} <span class="tr-side">${t.side}</span></span>
        ${t.kind === 'ng' ? '<span class="ng-badge">NG</span>' : ''}
        <span class="tr-status">${t.status}</span>
      </div>
      <div class="tc-body">
        <div class="tc-qty">${t.completedQty} / ${t.totalQty} ชิ้น (เหลือ ${t.remainingQty})</div>
        <div class="tc-progress">
          <div class="tc-progress-bar ${t.kind === 'ng' ? 'ng' : (pct === 100 ? 'done' : '')}" style="width:${pct}%"></div>
        </div>
        ${t.note ? `<div class="tc-note">${escapeHtml(t.note)}</div>` : ''}
        <div class="tc-time">${fmtTime(t.updatedAt)}</div>
      </div>
    </div>
  `;
}

// ====================================================================
// 6. ROUTER & EVENT LISTENERS
// ====================================================================
function goHome() { location.hash = 'home'; }

function switchTab(tab, value) {
  if (tab === 'paint') currentTab.paint = value;
  else if (tab === 'maint') currentTab.maint = value;
  route();
}

function setPaintField(field, value) { paintForm[field] = value; route(); }
function setNgField(field, value) { ngForm[field] = value; route(); }

function doCreateTicket() {
  const qty = parseInt(document.getElementById('paintQty').value);
  if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวน', 'error'); return; }
  const note = document.getElementById('paintNote').value;
  createTicket('paint', paintForm.model, paintForm.side, 'normal', qty, note);
  paintForm.qty = '';
  paintForm.note = '';
  showToast('✅ ส่งงานเรียบร้อย (Sync แล้ว)');
  route();
}

function doCreateNg() {
  const qty = parseInt(document.getElementById('ngQty').value);
  if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวน', 'error'); return; }
  const note = document.getElementById('ngNote').value;
  createTicket('paint', ngForm.model, ngForm.side, 'ng', qty, note);
  ngForm.qty = '';
  ngForm.note = '';
  showToast('✅ ส่ง NG เรียบร้อย (Sync แล้ว)');
  route();
}

function doReceive(id) {
  receiveTicket('paint', id);
  showToast('✅ รับงานคืนเรียบร้อย (Sync แล้ว)');
  route();
}

function doUpdateProgress(id) {
  const qtyInput = document.getElementById(`maintQty-${id}`);
  const qty = parseInt(qtyInput.value);
  if (!qty || qty <= 0) { showToast('กรุณากรอกจำนวนที่ทำเพิ่ม', 'error'); return; }
  updateProgress('maintenance', id, qty);
  showToast(`✅ อัปเดต +${qty} ชิ้น เรียบร้อย (Sync แล้ว)`);
  route();
}

function doSetInventory(model, side) {
  const key = `${model}-${side}`;
  const input = document.getElementById(`inv-${key}`);
  const val = parseInt(input.value);
  if (isNaN(val) || val < 0) { showToast('กรุณากรอกตัวเลขที่ถูกต้อง', 'error'); return; }
  setInventory(model, side, val);
  showToast('✅ บันทึกจำนวน Jig ในสต็อกแล้ว');
  route();
}

function route() {
  const role = getCurrentRole();
  if (!role || role === 'home') {
    document.body.style.setProperty('--accent', '#3E5C76');
    document.body.style.setProperty('--accent-dark', '#2C4356');
    renderHome();
    return;
  }
  if (role === 'paint') {
    document.body.style.setProperty('--accent', '#E1592C');
    document.body.style.setProperty('--accent-dark', '#B8451F');
    renderPaint();
  } else if (role === 'maintenance') {
    document.body.style.setProperty('--accent', '#B8791E');
    document.body.style.setProperty('--accent-dark', '#8F5F16');
    renderMaintenance();
  } else {
    document.body.style.setProperty('--accent', '#3E5C76');
    document.body.style.setProperty('--accent-dark', '#2C4356');
    renderOverview();
  }
}

document.addEventListener('click', function(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const model = el.dataset.model;
  const side = el.dataset.side;
  const field = el.dataset.field;
  const value = el.dataset.value;
  const tab = el.dataset.tab;
  const tabvalue = el.dataset.tabvalue;

  if (action === 'goHome') goHome();
  if (action === 'manualRefresh') fetchFromSheets();
  if (action === 'configSheets') configureSheetsUrl();
  if (action === 'switchTab') switchTab(tab, tabvalue);
  if (action === 'setPaintField') setPaintField(field, value);
  if (action === 'setNgField') setNgField(field, value);
  if (action === 'doCreateTicket') doCreateTicket();
  if (action === 'doCreateNg') doCreateNg();
  if (action === 'doReceive') doReceive(id);
  if (action === 'doUpdateProgress') doUpdateProgress(id);
  if (action === 'doSetInventory') doSetInventory(model, side);
});

window.addEventListener('hashchange', route);
route();

// โหลดข้อมูลล่าสุดทันทีที่เปิดหน้าเว็บ
if (getScriptUrl()) {
  fetchFromSheets(true);
}
</script>
</body>
</html>
